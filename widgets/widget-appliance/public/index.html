<html>
<head>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="homey-widget-full">
<div id="app">

  <!-- Panel 0 -->
  <div class="panel" id="panel0" style="display:none">
    <div class="p-hdr">
      <span class="dev-name" id="name0">—</span>
      <span class="remote" id="remote0"></span>
    </div>
    <div class="p-body">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 44 44">
          <circle class="ring-bg" cx="22" cy="22" r="19"/>
          <circle class="ring-main rp-w" id="prog0" cx="22" cy="22" r="19"/>
        </svg>
        <span class="ring-pct" id="pct0">—</span>
      </div>
      <div class="p-info">
        <div class="row"><span class="lbl">Status</span><span class="val" id="stat0">—</span></div>
        <div class="row"><span class="lbl">Left</span><span class="val tval tv-w" id="time0">—</span></div>
        <div class="row"><span class="lbl">Done</span><span class="val" id="done0">—</span></div>
      </div>
    </div>
    <div class="p-rings">
      <div class="m-ring">
        <div class="m-wrap">
          <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-power" id="pw-r0" cx="16" cy="16" r="12"/></svg>
          <span class="m-val" id="pw-v0">—</span>
        </div>
        <span class="m-unit">W</span>
      </div>
      <div class="m-ring">
        <div class="m-wrap">
          <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-energy" id="en-r0" cx="16" cy="16" r="12"/></svg>
          <span class="m-val" id="en-v0">—</span>
        </div>
        <span class="m-unit">kWh</span>
      </div>
      <div class="m-ring" id="wt-wrap0" style="display:none">
        <div class="m-wrap">
          <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-water" id="wt-r0" cx="16" cy="16" r="12"/></svg>
          <span class="m-val" id="wt-v0">—</span>
        </div>
        <span class="m-unit">L</span>
      </div>
    </div>
    <div class="p-cons" id="cons0" style="display:none">
      <span class="c-badge" id="det0" style="display:none">
        <span class="c-dot" id="det-dot0"></span>
        <span class="c-name">Det</span>
        <span class="c-val" id="det-val0">—</span>
      </span>
      <span class="c-badge" id="sof0" style="display:none">
        <span class="c-dot" id="sof-dot0"></span>
        <span class="c-name">Sof</span>
        <span class="c-val" id="sof-val0">—</span>
      </span>
    </div>
  </div>

  <div class="vdiv" id="vdiv" style="display:none"></div>

  <!-- Panel 1 -->
  <div class="panel" id="panel1" style="display:none">
    <div class="p-hdr">
      <span class="dev-name" id="name1">—</span>
      <span class="remote" id="remote1"></span>
    </div>
    <div class="p-body">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 44 44">
          <circle class="ring-bg" cx="22" cy="22" r="19"/>
          <circle class="ring-main rp-w" id="prog1" cx="22" cy="22" r="19"/>
        </svg>
        <span class="ring-pct" id="pct1">—</span>
      </div>
      <div class="p-info">
        <div class="row"><span class="lbl">Status</span><span class="val" id="stat1">—</span></div>
        <div class="row"><span class="lbl">Left</span><span class="val tval tv-w" id="time1">—</span></div>
        <div class="row"><span class="lbl">Done</span><span class="val" id="done1">—</span></div>
      </div>
    </div>
    <div class="p-rings">
      <div class="m-ring">
        <div class="m-wrap">
          <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-power" id="pw-r1" cx="16" cy="16" r="12"/></svg>
          <span class="m-val" id="pw-v1">—</span>
        </div>
        <span class="m-unit">W</span>
      </div>
      <div class="m-ring">
        <div class="m-wrap">
          <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-energy" id="en-r1" cx="16" cy="16" r="12"/></svg>
          <span class="m-val" id="en-v1">—</span>
        </div>
        <span class="m-unit">kWh</span>
      </div>
      <div class="m-ring" id="wt-wrap1" style="display:none">
        <div class="m-wrap">
          <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-water" id="wt-r1" cx="16" cy="16" r="12"/></svg>
          <span class="m-val" id="wt-v1">—</span>
        </div>
        <span class="m-unit">L</span>
      </div>
    </div>
    <div class="p-cons" id="cons1" style="display:none">
      <span class="c-badge" id="det1" style="display:none">
        <span class="c-dot" id="det-dot1"></span>
        <span class="c-name">Det</span>
        <span class="c-val" id="det-val1">—</span>
      </span>
      <span class="c-badge" id="sof1" style="display:none">
        <span class="c-dot" id="sof-dot1"></span>
        <span class="c-name">Sof</span>
        <span class="c-val" id="sof-val1">—</span>
      </span>
    </div>
  </div>

  <div class="empty-state" id="empty" style="display:none">Select washer and/or dryer in widget settings</div>
</div>

<script>
function onHomeyReady(Homey) {
  Homey.ready({ height: 240 });

  const C_MAIN = 2 * Math.PI * 19;
  const C_MINI = 2 * Math.PI * 12;
  const MAX_POWER = 3000, MAX_ENERGY = 2.5, MAX_WATER = 100;

  function setRing(el, C, pct) {
    el.style.strokeDasharray = C;
    el.style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0, pct)));
  }

  function finishTime(r) {
    if (!r || r === '-') return '—';
    const p = r.split(':');
    const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m)) return '—';
    const d = new Date();
    d.setHours(d.getHours() + h);
    d.setMinutes(d.getMinutes() + m);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function stateText(type, val) {
    const key = type === 'washer' ? 'samsung_washer_current_job_state' : 'samsung_dryer_current_job_state';
    return Homey.__(`${key}.${val}`) || val || '—';
  }

  function fmtPower(w) {
    if (w == null) return '—';
    return w >= 1000 ? (w / 1000).toFixed(1) + 'k' : String(Math.round(w));
  }

  function consStatus(val) {
    const map = { normal: ['OK', 'c-ok'], low: ['Low', 'c-low'], empty: ['Empty', 'c-empty'], error: ['Err', 'c-empty'] };
    return map[val] || [val || '—', 'c-ok'];
  }

  function updatePanel(idx, info) {
    const panel = document.getElementById('panel' + idx);
    if (!panel) return;
    panel.style.display = 'flex';

    const type = info.type || 'washer';
    const isW = type === 'washer';

    document.getElementById('name' + idx).textContent = info.name || '—';

    const rem = document.getElementById('remote' + idx);
    if (info.remoteEnabled) {
      rem.textContent = 'Remote';
      rem.className = 'remote remote-' + (isW ? 'w' : 'd');
      rem.style.display = 'inline-block';
    } else {
      rem.style.display = 'none';
    }

    const state = (info.state === 'none' ? 'off' : info.state) || 'off';
    const prog = state === 'off' ? 0 : (info.progress || 0);
    const pct = prog < 2 ? 0 : prog;

    const progEl = document.getElementById('prog' + idx);
    progEl.className = 'ring-main rp-' + (isW ? 'w' : 'd');
    setRing(progEl, C_MAIN, pct / 100);
    document.getElementById('pct' + idx).textContent = pct < 2 ? '—' : Math.round(pct) + '%';

    document.getElementById('stat' + idx).textContent = stateText(type, state);

    const rem_time = state === 'off' ? '—' : (info.remainingTime || '—');
    const timeEl = document.getElementById('time' + idx);
    timeEl.textContent = rem_time;
    timeEl.className = 'val tval tv-' + (isW ? 'w' : 'd');
    document.getElementById('done' + idx).textContent = state === 'off' ? '—' : finishTime(rem_time);

    setRing(document.getElementById('pw-r' + idx), C_MINI, info.power != null ? info.power / MAX_POWER : 0);
    document.getElementById('pw-v' + idx).textContent = fmtPower(info.power);

    setRing(document.getElementById('en-r' + idx), C_MINI, info.energy != null ? info.energy / MAX_ENERGY : 0);
    document.getElementById('en-v' + idx).textContent = info.energy != null ? info.energy.toFixed(2) : '—';

    const wtWrap = document.getElementById('wt-wrap' + idx);
    if (info.water != null) {
      wtWrap.style.display = 'flex';
      setRing(document.getElementById('wt-r' + idx), C_MINI, info.water / MAX_WATER);
      document.getElementById('wt-v' + idx).textContent = Math.round(info.water);
    } else {
      wtWrap.style.display = 'none';
    }

    const consEl = document.getElementById('cons' + idx);
    const hasDet = info.detergent != null;
    const hasSof = info.softener != null;
    consEl.style.display = (hasDet || hasSof) ? 'flex' : 'none';

    [['det', info.detergent], ['sof', info.softener]].forEach(([key, val]) => {
      const el = document.getElementById(key + idx);
      if (!el) return;
      if (val != null) {
        el.style.display = 'flex';
        const [label, cls] = consStatus(val);
        document.getElementById(key + '-dot' + idx).className = 'c-dot ' + cls;
        document.getElementById(key + '-val' + idx).textContent = label;
      } else {
        el.style.display = 'none';
      }
    });
  }

  const ids = Homey.getDeviceIds();

  function refresh() {
    if (!ids || ids.length === 0) {
      document.getElementById('empty').style.display = 'flex';
      return;
    }
    document.getElementById('empty').style.display = 'none';
    const visible = ids.slice(0, 2);
    visible.forEach((deviceId, idx) => {
      Homey.api('GET', '/?deviceId=' + deviceId)
        .then(info => {
          updatePanel(idx, info);
          if (visible.length > 1) document.getElementById('vdiv').style.display = 'block';
        })
        .catch(() => {});
    });
  }

  refresh();
  setInterval(refresh, 5000);
}
</script>
</body>
</html>
