<html>
<head>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="homey-widget-full">
<div id="app">

  <div class="p-hdr">
    <span class="dev-name" id="name">—</span>
    <span class="remote" id="remote" style="display:none">Remote</span>
  </div>

  <div class="p-body">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 44 44">
        <circle class="ring-bg" cx="22" cy="22" r="19"/>
        <circle class="ring-main" id="prog" cx="22" cy="22" r="19"/>
      </svg>
      <span class="ring-pct" id="pct">—</span>
    </div>
    <div class="p-info">
      <div class="row"><span class="lbl">Status</span><span class="val" id="stat">—</span></div>
      <div class="row"><span class="lbl">Left</span><span class="val tval" id="time">—</span></div>
      <div class="row"><span class="lbl">Done</span><span class="val" id="done">—</span></div>
    </div>
  </div>

  <div class="p-rings">
    <div class="m-ring">
      <div class="m-wrap">
        <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-power" id="pw-r" cx="16" cy="16" r="12"/></svg>
        <span class="m-val" id="pw-v">—</span>
      </div>
      <span class="m-unit">W</span>
    </div>
    <div class="m-ring">
      <div class="m-wrap">
        <svg class="m-svg" viewBox="0 0 32 32"><circle class="m-bg" cx="16" cy="16" r="12"/><circle class="m-fill m-energy" id="en-r" cx="16" cy="16" r="12"/></svg>
        <span class="m-val" id="en-v">—</span>
      </div>
      <span class="m-unit">kWh</span>
    </div>
  </div>

</div>

<script>
function onHomeyReady(Homey) {
  Homey.ready({ height: 210 });

  const C_MAIN = 2 * Math.PI * 19;
  const C_MINI = 2 * Math.PI * 12;
  const MAX_POWER = 3000, MAX_ENERGY = 2.5;
  const deviceId = Homey.getDeviceIds()[0];

  function setRing(el, C, pct) {
    el.style.strokeDasharray = C;
    el.style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0, pct)));
  }

  function finishTime(r) {
    if (!r || r === '-') return '—';
    const p = r.split(':');
    const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m)) return '—';
    const d = new Date();
    d.setHours(d.getHours() + h);
    d.setMinutes(d.getMinutes() + m);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function fmtPower(w) {
    if (w == null) return '—';
    return w >= 1000 ? (w / 1000).toFixed(1) + 'k' : String(Math.round(w));
  }

  function refresh() {
    if (!deviceId) return;
    Homey.api('GET', '/?deviceId=' + deviceId)
      .then(info => {
        document.getElementById('name').textContent = info.name || '—';

        const rem = document.getElementById('remote');
        rem.style.display = info.remoteEnabled ? 'inline-block' : 'none';

        const state = (info.state === 'none' ? 'off' : info.state) || 'off';
        const prog = state === 'off' ? 0 : (info.progress || 0);
        const pct = prog < 2 ? 0 : prog;

        setRing(document.getElementById('prog'), C_MAIN, pct / 100);
        document.getElementById('pct').textContent = pct < 2 ? '—' : Math.round(pct) + '%';

        document.getElementById('stat').textContent =
          Homey.__('samsung_dryer_current_job_state.' + state) || state || '—';

        const rem_time = state === 'off' ? '—' : (info.remainingTime || '—');
        document.getElementById('time').textContent = rem_time;
        document.getElementById('done').textContent = state === 'off' ? '—' : finishTime(rem_time);

        setRing(document.getElementById('pw-r'), C_MINI, info.power != null ? info.power / MAX_POWER : 0);
        document.getElementById('pw-v').textContent = fmtPower(info.power);

        setRing(document.getElementById('en-r'), C_MINI, info.energy != null ? info.energy / MAX_ENERGY : 0);
        document.getElementById('en-v').textContent = info.energy != null ? info.energy.toFixed(2) : '—';
      })
      .catch(() => {});
  }

  refresh();
  setInterval(refresh, 5000);
}
</script>
</body>
</html>
